name: Testa eventkällor

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresser att testa, separerade med mellanslag"
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe-sources.mjs ${{ github.event.inputs.urls }}
