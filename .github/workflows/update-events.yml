name: Hämta event

on:
  schedule:
    - cron: "0 4 * * 1" # måndagar 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Hämta event
        run: node scripts/fetch-events.mjs
        env:
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add events.json priser.json
          git diff --cached --quiet || (git commit -m "Uppdatera event" && git pull --rebase && git push)
