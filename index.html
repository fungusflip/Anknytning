<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anknytning demo</title>
<style>
/* Layout: one phone-sized app column, centered on desktop, full width on phones */
:root{
  --bg:#eef0f6; --phone:#ffffff; --fg:#1b1d2a; --muted:#6b6f84; --line:#dfe2ec;
  --accent:#ff5a5f; --accent2:#3b5bdb; --ok:#2f9e44; --chip:#f1f3fa;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0f1016; --phone:#181a24; --fg:#eef0f8; --muted:#9a9eb3; --line:#2b2e3d; --chip:#232634; color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;justify-content:center;align-items:center;padding:16px}
.phone{width:100%;max-width:390px;height:min(800px,100%);background:var(--phone);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;position:relative}
header{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:22px;margin:0;letter-spacing:-.02em}
header h1 span{color:var(--accent)}
header small{color:var(--muted)}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:8px 16px 16px;overflow-y:auto}
.view[hidden]{display:none}
nav{display:flex;border-top:1px solid var(--line)}
nav button{flex:1;padding:12px 4px 14px;background:none;border:0;color:var(--muted);font:600 13px var(--font);cursor:pointer}
nav button.on{color:var(--accent)}
nav .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;margin-left:4px}
/* swipe */
#v-start{display:flex;flex-direction:column}
#v-start[hidden]{display:none}
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--phone);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12);touch-action:none;user-select:none;cursor:grab;display:flex;flex-direction:column}
.card .img{flex:1;display:flex;align-items:center;justify-content:center;font-size:84px}
.card .info{padding:14px 16px 16px;display:grid;gap:8px}
.card h2{margin:0;font-size:20px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.chip.free{background:var(--ok);color:#fff;font-weight:700}
.stamp{z-index:2;position:absolute;top:20px;padding:6px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:20px;opacity:0;transform:rotate(-12deg)}
.stamp.yes{left:20px;color:var(--ok)} .stamp.no{right:20px;color:var(--accent);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;gap:24px;padding-top:14px;flex:none}
.actions button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--phone);font-size:24px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.empty{text-align:center;color:var(--muted);padding-top:120px}
/* list */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:16px var(--font)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tags button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font:13px var(--font)}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.row:hover{background:var(--chip)}
.row .e{position:relative;overflow:hidden;font-size:30px;width:52px;height:52px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.row b{display:block}
.row small{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
/* detail */
.detail .big{font-size:96px;text-align:center;padding:16px 0}
.detail h2{margin:0 0 8px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:16px 0}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-weight:600}
.back{background:none;border:0;color:var(--accent2);font:600 15px var(--font);cursor:pointer;padding:4px 0}
.cta{width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:700 16px var(--font);cursor:pointer}
.note{position:absolute;left:16px;right:16px;top:64px;z-index:5;background:var(--fg);color:var(--phone);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.note.show{opacity:1}
.where{background:var(--chip);border:0;border-radius:999px;padding:6px 12px;color:var(--fg);font:600 13px var(--font);cursor:pointer}
.where::before{content:"📍 "}
.source{margin:0;padding:0 20px 6px;color:var(--muted);font-size:12px}
.card .img{position:relative;overflow:hidden;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.card .img img,.detail .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail .pic{position:relative;overflow:hidden;border-radius:16px;margin:10px 0;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:72px}
.detail .hero{width:100%;border-radius:16px;margin:10px 0;aspect-ratio:16/9;object-fit:cover}
.link{display:block;text-align:center;margin:0 0 12px;color:var(--accent2);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <header><h1>Ank<span>nytning</span></h1><button class="where" id="where" title="Använd min plats">Nära Bro</button></header>
  <p class="source" id="source"></p>
  <main>
    <section class="view" id="v-start">
      <div class="deck" id="deck"></div>
      <div class="actions">
        <button id="btn-no" aria-label="Nästa">✕</button>
        <button id="btn-yes" aria-label="Intresserad">♥</button>
      </div>
    </section>
    <section class="view" id="v-sok" hidden>
      <input class="search" id="q" placeholder="Sök med intresseord, t.ex. gaming" autocomplete="off">
      <div class="tags" id="tags"></div>
      <div id="results"></div>
    </section>
    <section class="view" id="v-int" hidden>
      <p class="hint">Event du swipeat höger på.</p>
      <div id="saved"></div>
    </section>
    <section class="view detail" id="v-detail" hidden></section>
  </main>
  <nav>
    <button data-v="start" class="on">Start</button>
    <button data-v="sok">Sök</button>
    <button data-v="int">Intresserade<span class="n" id="count" hidden>0</span></button>
  </nav>
  <div class="note" id="note"></div>
</div>
<script>
// Inbyggda exempel används om events.json inte går att läsa (t.ex. när filen öppnas direkt från datorn)
const FALLBACK={exempel:true,kalla:"Exempel",events:[
 {id:"x1",t:"LAN-kväll på biblioteket",e:"🎮",om_dagar:1,tid:"18:00",plats:"Kungsängens bibliotek",lat:59.4777,lon:17.7516,pris:0,tags:["gaming","spel"]},
 {id:"x2",t:"Pumpkin patch",e:"🎃",om_dagar:2,tid:"11:00",plats:"Bro gård, Bro",lat:59.515,lon:17.628,pris:60,tags:["natur","höst","foto"]},
 {id:"x3",t:"Prova på klättring",e:"🧗",om_dagar:3,tid:"14:00",plats:"Klätterverket, Sundbyberg",lat:59.3632,lon:17.9692,pris:120,tags:["sport","träning"]},
 {id:"x4",t:"Open mic för unga",e:"🎤",om_dagar:4,tid:"19:00",plats:"Kulturhuset, Stockholm",lat:59.3326,lon:18.0649,pris:0,tags:["musik","scen"]},
 {id:"x5",t:"Frisbeegolf-meetup",e:"🥏",om_dagar:2,tid:"13:00",plats:"Görvälns slottspark, Järfälla",lat:59.4183,lon:17.7444,pris:0,tags:["sport","natur"]},
 {id:"x6",t:"Kreativ kväll: zines",e:"🎨",om_dagar:5,tid:"17:30",plats:"Fryshuset, Stockholm",lat:59.301,lon:18.0954,pris:40,tags:["konst","skapa"]},
 {id:"x7",t:"Matmarknad i centrum",e:"🍜",om_dagar:3,tid:"12:00",plats:"Bro centrum, Bro",lat:59.5113,lon:17.635,pris:0,tags:["mat"]}
]};
const BRO={lat:59.5113,lon:17.635,namn:"Bro"};
let EVENTS=[],queue=[],saved=[],prev="start",me={...BRO},meta={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.toISOString().slice(0,10);

// Avstånd i km (haversine)
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
 const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const kmTxt=ev=>{const d=km(me,ev);return d<1?"< 1 km":d.toFixed(d<10?1:0).replace(".",",")+" km"};

// Datum
const DAG=["sön","mån","tis","ons","tor","fre","lör"];
function when(ev){const d=new Date(ev.datum+"T00:00"),t=new Date();t.setHours(0,0,0,0);
 const diff=Math.round((d-t)/864e5),day=diff===0?"Idag":diff===1?"Imorgon":DAG[d.getDay()][0].toUpperCase()+DAG[d.getDay()].slice(1)+" "+d.getDate()+"/"+(d.getMonth()+1);
 return day+(ev.tid?" "+ev.tid:"")}
const priceTxt=p=>p===0?"Gratis":p==null?"Se pris":p+" kr";
const price=p=>p===0?'<span class="chip free">Gratis</span>':`<span class="chip">${priceTxt(p)}</span>`;

// Väder från Open-Meteo (gratis, ingen nyckel). Prognos finns för ca 14 dagar framåt.
const WMO=[[0,"☀️","Klart"],[2,"🌤️","Lätt molnigt"],[3,"☁️","Mulet"],[48,"🌫️","Dimma"],[57,"🌦️","Duggregn"],[67,"🌧️","Regn"],[77,"🌨️","Snö"],[82,"🌧️","Skurar"],[86,"🌨️","Snöbyar"],[99,"⛈️","Åska"]];
const wmo=c=>WMO.find(([max])=>c<=max)||WMO[2];
const wCache={};
function weather(ev){
 const k=ev.lat.toFixed(2)+","+ev.lon.toFixed(2);
 wCache[k]??=fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ev.lat}&longitude=${ev.lon}&daily=weathercode,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FStockholm&forecast_days=16`).then(r=>r.ok?r.json():null).catch(()=>null);
 return wCache[k].then(d=>{if(!d?.daily)return null;const i=d.daily.time.indexOf(ev.datum);if(i<0)return null;
  const [,ic,txt]=wmo(d.daily.weathercode[i]);return `${ic} ${Math.round(d.daily.temperature_2m_max[i])}°C, ${txt.toLowerCase()}`+(d.daily.precipitation_probability_max[i]>=40?` (${d.daily.precipitation_probability_max[i]}% regn)`:"")});
}
function fillWeather(root){root.querySelectorAll("[data-w]").forEach(el=>{const ev=EVENTS.find(e=>e.id===el.dataset.w);
 weather(ev).then(w=>{if(w){el.textContent=w;el.hidden=false}})})}

// Bild: eventets egen bild om den finns, annars en färgbakgrund som hör till eventets kategori
const PALETT=[["#ff7a59","#ff3d71"],["#7b61ff","#3b5bdb"],["#00b4d8","#0077b6"],["#2bb673","#0b8a5f"],["#ffb347","#ff7a00"],["#ff6fb5","#b5179e"],["#5ad1c8","#2a9d8f"]];
function art(ev){const k=(ev.tags[0]||ev.t);let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;
 const [a,b]=PALETT[h%PALETT.length];return `background:linear-gradient(135deg,${a},${b})`}
const pic=(ev,cls)=>`<div class="${cls}" style="${art(ev)}">${ev.e}${ev.img?`<img src="${esc(ev.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`;

const facts=ev=>`<div class="facts">${price(ev.pris)}<span class="chip">🕒 ${esc(when(ev))}</span><span class="chip">📍 ${esc(ev.plats)} · ${kmTxt(ev)}</span><span class="chip" data-w="${esc(ev.id)}" hidden></span></div>`;

function note(msg){const n=$("#note");n.textContent=msg;n.classList.add("show");clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove("show"),1600)}
function show(v){
 document.querySelectorAll(".view").forEach(x=>x.hidden=true);
 $("#v-"+v).hidden=false;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 if(v!=="detail")prev=v;
 if(v==="int")renderSaved();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));

// Närmast först, sedan tidigast
function sortNear(list){return [...list].sort((a,b)=>Math.round(km(me,a)/5)-Math.round(km(me,b)/5)||(a.datum+a.tid).localeCompare(b.datum+b.tid))}

// Start: swipe-kort
function renderDeck(){
 const d=$("#deck");d.innerHTML="";
 if(!queue.length){d.innerHTML='<div class="empty">Inga fler event just nu.<br><br><button class="back" id="again">Visa igen</button></div>';$("#again").onclick=()=>{queue=sortNear(EVENTS.filter(e=>!saved.includes(e)));renderDeck()};return}
 queue.slice(0,2).reverse().forEach((ev,i,arr)=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="stamp yes">GÅ DIT</div><div class="stamp no">NÄSTA</div>${pic(ev,"img")}<div class="info"><h2>${esc(ev.t)}</h2>${facts(ev)}</div>`;
  if(i===arr.length-1)drag(c,ev);
  d.appendChild(c);
 });
 fillWeather(d);
}
function decide(ev,yes,card){
 queue=queue.filter(e=>e!==ev);
 if(yes&&!saved.includes(ev)){saved.push(ev);note("Sparad i Intresserade ♥")}
 updateCount();
 if(card){card.style.transition="transform .3s, opacity .3s";card.style.transform=`translateX(${yes?500:-500}px) rotate(${yes?20:-20}deg)`;card.style.opacity=0;setTimeout(renderDeck,250)}else renderDeck();
}
function drag(c,ev){
 let x0=null,dx=0,moved=false;
 c.onpointerdown=e=>{x0=e.clientX;moved=false;c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>5)moved=true;c.style.transform=`translateX(${dx}px) rotate(${dx/15}deg)`;c.querySelector(".yes").style.opacity=Math.max(0,dx/100);c.querySelector(".no").style.opacity=Math.max(0,-dx/100)};
 c.onpointerup=()=>{if(x0===null)return;x0=null;if(dx>100)decide(ev,true,c);else if(dx<-100)decide(ev,false,c);else{c.style.transition="transform .2s";c.style.transform="";c.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);setTimeout(()=>c.style.transition="",200);if(!moved)openDetail(ev)}dx=0};
}
$("#btn-yes").onclick=()=>queue[0]&&decide(queue[0],true,$("#deck .card:last-child"));
$("#btn-no").onclick=()=>queue[0]&&decide(queue[0],false,$("#deck .card:last-child"));
document.addEventListener("keydown",e=>{if($("#v-start").hidden)return;if(e.key==="ArrowRight")$("#btn-yes").click();if(e.key==="ArrowLeft")$("#btn-no").click()});

// Lista (Sök + Intresserade)
const row=ev=>`<div class="row" data-id="${esc(ev.id)}">${pic(ev,"e")}<div><b>${esc(ev.t)}</b><small>${esc(when(ev))} · ${priceTxt(ev.pris)} · ${kmTxt(ev)}</small></div></div>`;
function bindRows(el){el.querySelectorAll(".row").forEach(r=>r.onclick=()=>openDetail(EVENTS.find(e=>e.id===r.dataset.id)))}
function search(){
 const q=$("#q").value.trim().toLowerCase();
 const hits=sortNear(q?EVENTS.filter(e=>e.tags.some(t=>t.includes(q))||e.t.toLowerCase().includes(q)||e.plats.toLowerCase().includes(q)):EVENTS);
 const r=$("#results");
 r.innerHTML=hits.length?hits.slice(0,60).map(row).join(""):'<p class="hint">Inga träffar. Här är närmaste event:</p>'+row(sortNear(EVENTS)[0]);
 bindRows(r);
}
$("#q").oninput=search;
function renderTags(){
 const count={};EVENTS.forEach(e=>e.tags.forEach(t=>count[t]=(count[t]||0)+1));
 const top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t])=>t);
 $("#tags").innerHTML=top.map(t=>`<button>${esc(t)}</button>`).join("");
 $("#tags").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("#q").value=b.textContent;search()});
}
function renderSaved(){const s=$("#saved");s.innerHTML=saved.length?saved.map(row).join(""):'<p class="hint">Inget sparat än. Swipea höger på Start.</p>';bindRows(s)}
function updateCount(){const c=$("#count");c.textContent=saved.length;c.hidden=!saved.length}

// Eventdetalj
function openDetail(ev){
 const d=$("#v-detail");
 d.innerHTML=`<button class="back" id="back">‹ Tillbaka</button>${pic(ev,"pic")}<h2>${esc(ev.t)}</h2>
 <dl><dt>När</dt><dd>${esc(when(ev))}</dd><dt>Plats</dt><dd>${esc(ev.plats)}</dd><dt>Avstånd</dt><dd>${kmTxt(ev)} från ${esc(me.namn)}</dd><dt>Pris</dt><dd>${priceTxt(ev.pris)}</dd><dt>Väder</dt><dd id="dw">Hämtar…</dd></dl>
 ${ev.url?`<a class="link" href="${esc(ev.url)}" target="_blank" rel="noopener">Mer info och biljetter ↗</a>`:""}
 <button class="cta" id="save">${saved.includes(ev)?"Sparad ♥":"Jag är intresserad ♥"}</button>`;
 weather(ev).then(w=>{const el=$("#dw");if(el)el.textContent=w||"Ingen prognos just nu (finns ca 2 veckor framåt)"});
 $("#back").onclick=()=>show(prev);
 $("#save").onclick=()=>{if(!saved.includes(ev)){saved.push(ev);queue=queue.filter(e=>e!==ev);updateCount();renderDeck();note("Sparad i Intresserade ♥")}$("#save").textContent="Sparad ♥"};
 show("detail");
}

// Plats
function refresh(){queue=sortNear(EVENTS.filter(e=>!saved.includes(e)));renderDeck();search();$("#where").textContent="Nära "+me.namn}
function locate(){
 if(!navigator.geolocation){note("Din webbläsare kan inte dela plats");return}
 $("#where").textContent="Hämtar plats…";
 navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lon:p.coords.longitude,namn:"dig"};refresh();note("Visar event nära dig")},
  ()=>{$("#where").textContent="Nära "+me.namn;note("Platsen nekades, visar nära Bro")},{timeout:10000,maximumAge:600000});
}
$("#where").onclick=locate;

// Start
(async()=>{
 let data;
 try{const r=await fetch("events.json",{cache:"no-cache"});data=r.ok?await r.json():FALLBACK}catch{data=FALLBACK}
 const today=new Date();today.setHours(0,0,0,0);
 EVENTS=data.events.map(e=>({img:null,url:null,tags:[],e:"✨",...e,
   datum:e.datum??iso(new Date(today.getTime()+(e.om_dagar||0)*864e5+12*36e5))}))
  .filter(e=>e.datum>=iso(today)&&Number.isFinite(e.lat));
 meta=data;
 $("#source").textContent=data.exempel?"Exempel-event":`${EVENTS.length} event · ${data.kalla}`;
 renderTags();refresh();
 locate();
})();
</script>
</body>
</html>
