<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anknytning demo</title>
<style>
/* Layout: one phone-sized app column, centered on desktop, full width on phones */
:root{
  --bg:#f1ede6; --phone:#fffdf9; --fg:#1c1b22; --muted:#77727d; --line:#e6e1da;
  --accent:#ff4f64; --accent2:#1f7a74; --ok:#1f9d6b; --chip:#f3efe8;
  --grad:linear-gradient(135deg,#ff4f64,#ff8a5b);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0d0c11; --phone:#17161d; --fg:#f4f1f8; --muted:#a29fb0; --line:#2c2a36; --chip:#23212c; --accent:#ff6b7e; --accent2:#4fc3b9; --ok:#3fcf94; color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);display:flex;justify-content:center;align-items:center;padding:16px}
.phone{width:100%;max-width:390px;height:min(800px,100%);background:var(--phone);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;position:relative}
header[hidden]{display:none}
header{position:absolute;top:0;left:0;right:0;z-index:4;padding:16px 20px 36px;display:flex;justify-content:space-between;align-items:center;color:#fff;background:linear-gradient(rgba(0,0,0,.5),transparent);pointer-events:none}
header h1{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0;text-shadow:0 1px 6px rgba(0,0,0,.35)}
header small{color:var(--muted)}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;padding:8px 16px 16px;overflow-y:auto}
#v-start{padding:0 0 4px}
.view[hidden]{display:none}
nav{display:flex;margin:14px 28px 12px;padding:2px;gap:4px;border-radius:999px;background:transparent;box-shadow:none;border:1px solid var(--line)}
nav button{flex:1;padding:4px 4px 5px;border-radius:999px;background:none;border:0;color:var(--muted);font:600 11px var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--fg);background:var(--chip)}
nav .n{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;line-height:16px}
/* swipe */
#v-start{display:flex;flex-direction:column}
#v-start[hidden]{display:none}
.deck{position:relative;flex:1;min-height:0}
.card{position:absolute;inset:0;border-radius:0 0 28px 28px;overflow:hidden;background:#222;box-shadow:0 8px 24px rgba(0,0,0,.12);touch-action:none;user-select:none;cursor:grab;display:flex;flex-direction:column}
.card img{pointer-events:none;-webkit-user-drag:none;user-select:none}
.card .img{position:absolute!important;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;padding-bottom:30%}
.card .info{position:relative;margin-top:auto;padding:60px 14px 48px;display:grid;gap:8px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55) 35%,rgba(0,0,0,.8))}
.card .info .chip{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);flex:1 1 auto;text-align:center;padding:8px 10px;font-size:14px;font-weight:600}
.card .info{text-align:center}
.card .info .sub{font-size:14px;opacity:.85}
.card .info .facts{justify-content:center}
.card .info .chip.free{background:var(--ok)}
.card h2{margin:0;font-size:20px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.chip.free{background:var(--ok);color:#fff;font-weight:700}
.stamp{z-index:2;position:absolute;top:20px;padding:6px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:20px;opacity:0;transform:rotate(-12deg)}
.stamp.yes{left:20px;color:var(--ok)} .stamp.no{right:20px;color:var(--accent);transform:rotate(12deg)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 28px 22px;margin-top:-31px;position:relative;z-index:3;flex:none;pointer-events:none}.actions button{pointer-events:auto}
.actions button:not(.where){width:62px;height:62px;color:var(--muted);border-radius:50%;border:1px solid var(--line);background:var(--phone);font-size:28px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.actions #btn-yes{color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding-top:120px}
/* list */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--fg);font:16px var(--font)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tags button.on{background:var(--fg);color:var(--phone);border-color:var(--fg)}
.tags button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font:13px var(--font)}
.row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px;cursor:pointer}
.row:hover{filter:brightness(.97)}
.row .e{position:relative;overflow:hidden;font-size:30px;width:52px;height:52px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.row b{display:block}
.row small{color:var(--muted)}
/* sparade: rubriker med sidscrollande fyrkantiga kort */
.shelf h3{margin:14px 0 8px;font-size:16px;text-transform:capitalize}
.shelf .rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:16px;margin:0 -16px;padding:0 16px 6px;scrollbar-width:none}
.shelf .rail::-webkit-scrollbar{display:none}
.sq{position:relative;flex:none;width:150px;aspect-ratio:1;border-radius:16px;overflow:hidden;scroll-snap-align:start;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:flex-end}
.sq .sqimg{position:absolute!important;inset:0;display:flex;align-items:center;justify-content:center;font-size:48px;padding-bottom:30%}
.sq .sqimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sq .sqt{position:relative;padding:36px 10px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:13px;font-weight:700;line-height:1.25}
.card.flipped{background:var(--phone);color:var(--fg);cursor:default;overflow-y:auto;display:block}
.card .bimg{position:relative;overflow:hidden;height:40%;flex:none;display:flex;align-items:center;justify-content:center;font-size:80px;color:#fff}
.card .bimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .bi{padding:10px 14px 14px;display:grid;gap:8px}
.card .bi h2{margin:0;font-size:20px;text-shadow:none}
.card .bi .chip{background:var(--chip)}
.card .bi .cta{margin:0}
.card .bi .back{text-align:center;justify-self:center}
.card .flipb{position:absolute;left:12px;bottom:12px;z-index:2;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:999px;padding:6px 12px;font:600 13px var(--font);backdrop-filter:blur(6px);pointer-events:none}
.card .bimg{cursor:pointer}
.sq .sqt small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
.mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.mini span{background:var(--phone);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted)}
.row{background:var(--chip)}
.row+.row{margin-top:8px}
.row .e{background:var(--phone)}
.hint{color:var(--muted);font-size:13px}
.sh{margin:18px 0 6px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}.sh b{color:var(--accent);font-size:14px}
#pris{width:100%;accent-color:var(--accent);margin:4px 0 8px}
#sok-list .back{margin-bottom:6px}
.filter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}
.filter b{font-size:12px;color:var(--muted);width:48px}
.seg{border:1px solid var(--line);background:none;color:var(--fg);border-radius:999px;padding:4px 10px;cursor:pointer;font:13px var(--font)}
.seg.on{background:var(--accent);border-color:var(--accent);color:#fff}
.go{width:100%;margin:6px 0 4px;padding:14px;border:0;border-radius:14px;background:var(--grad);color:#fff;font:600 15px var(--font);cursor:pointer}
.go:disabled{opacity:.4;cursor:default}
.go.ghost{background:none;border:2px solid var(--line);color:var(--fg);margin-top:0}
.mode{position:absolute;top:50px;left:14px;right:14px;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--phone);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:12px;padding:6px 12px;font-size:13px}
.mode[hidden]{display:none}
/* detail */
.detail .big{font-size:96px;text-align:center;padding:16px 0}
.detail h2{margin:0 0 8px}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:16px 0}
.detail dt{color:var(--muted)}
.detail dd{margin:0;font-weight:600}
.back{background:none;border:0;color:var(--accent2);font:600 15px var(--font);cursor:pointer;padding:4px 0}
.cta{display:block;text-align:center;text-decoration:none;margin-bottom:10px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--grad);color:#fff;font:700 16px var(--font);cursor:pointer}
.note{position:absolute;left:16px;right:16px;top:64px;z-index:5;background:var(--fg);color:var(--phone);padding:10px 14px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.note.show{opacity:1}
.where{background:var(--phone);box-shadow:0 4px 14px rgba(0,0,0,.18);border:0;border-radius:999px;padding:6px 12px;color:var(--fg);font:600 13px var(--font);cursor:pointer}
.where::before{content:"📍 "}
.source{margin:16px 0 0;color:var(--muted);font-size:12px}
.card .img{position:relative;overflow:hidden;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.25)}
.card .img img,.detail .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.detail .pic{position:relative;overflow:hidden;border-radius:16px;margin:10px 0;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:72px}
.detail .hero{width:100%;border-radius:16px;margin:10px 0;aspect-ratio:16/9;object-fit:cover}
.cta.ghost{background:none;border:2px solid var(--accent2);color:var(--accent2)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <header><h1>anknytning</h1></header>
  <main>
    <section class="view" id="v-start">
      <div class="mode" id="mode" hidden><span id="mode-txt"></span><button class="back" id="mode-clear">Visa alla</button></div>
      <div class="deck" id="deck"></div>
      <div class="actions">
        <button id="btn-no" aria-label="Nästa">✕</button>
        <button class="where" id="where" title="Använd min plats">Nära Bro</button>
        <button id="btn-yes" aria-label="Intresserad">♥</button>
      </div>
    </section>
    <section class="view" id="v-sok" hidden>
      <div id="sok-pick">
        <input class="search" id="q" placeholder="Sök med intresseord, t.ex. gaming" autocomplete="off">
        <h3 class="sh">Vad gillar du?</h3>
        <div class="tags" id="tags" role="group" aria-label="Vad gillar du?"></div>
        <h3 class="sh">Max pris <b id="pris-txt">Alla priser</b></h3>
        <input type="range" id="pris" min="0" max="500" step="50" value="500" aria-label="Max pris">
        <p class="hint" id="count-hits"></p>
        <button class="go" id="swipe-hits">Swipea</button>
        <button class="go ghost" id="list-hits">Visa som lista</button>
        <p class="source" id="source"></p>
      </div>
      <div id="sok-list" hidden>
        <button class="back" id="list-back">‹ Ändra val</button>
        <p class="hint" id="list-sum"></p>
        <div class="filter" id="f-sort"><b>Sortera</b>
          <button class="seg" data-s="near">Närmast</button><button class="seg" data-s="soon">Snarast</button><button class="seg" data-s="price">Billigast</button>
        </div>
        <div id="results"></div>
      </div>
    </section>
    <section class="view" id="v-int" hidden>
      <p class="hint">Event du swipeat höger på.</p>
      <div id="saved"></div>
    </section>
    <section class="view detail" id="v-detail" hidden></section>
  </main>
  <nav>
    <button data-v="start" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>Start</button>
    <button data-v="sok"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Sök</button>
    <button data-v="int"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Sparade<span class="n" id="count" hidden>0</span></button>
  </nav>
  <div class="note" id="note"></div>
</div>
<script>
const BRO={lat:59.5113,lon:17.635,namn:"Bro"};
let EVENTS=[],queue=[],saved=[],prev="start",me={...BRO},meta={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.toISOString().slice(0,10);

// Avstånd i km (haversine)
function km(a,b){const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
 const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const kmTxt=ev=>{const d=km(me,ev);return d<1?"< 1 km":d.toFixed(d<10?1:0).replace(".",",")+" km"};

// Datum
const DAG=["sön","mån","tis","ons","tor","fre","lör"];
function rel(diff){
 if(diff===0)return"Idag";if(diff===1)return"Imorgon";if(diff<7)return`om ${diff} dagar`;
 if(diff<31){const w=Math.round(diff/7);return`om ${w} ${w===1?"vecka":"veckor"}`}
 const m=Math.round(diff/30.4);return`om ${m} ${m===1?"månad":"månader"}`}
function when(ev){const d=new Date(ev.datum+"T00:00"),t=new Date();t.setHours(0,0,0,0);
 const diff=Math.round((d-t)/864e5),r=rel(diff),dag=DAG[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)+(d.getFullYear()!==t.getFullYear()?" "+d.getFullYear():"");
 if(ev.slut&&diff<=0){const s=new Date(ev.slut+"T00:00");return"Pågår till "+s.getDate()+"/"+(s.getMonth()+1)}
 return (diff<=1?r+", "+dag:dag+" ("+r+")")+(ev.tid?" "+ev.tid:"")}
// Priset hämtas från eventens egna sidor. Saknas det står det "Pris okänt".
const priceTxt=p=>p===0?"Gratis":p==null?"Okänt pris":p+" kr";
const price=p=>p===0?'<span class="chip free">Gratis</span>':p==null?'<span class="chip">Pris okänt</span>':`<span class="chip">${p} kr</span>`;

// Väder från Open-Meteo (gratis, ingen nyckel). Prognos finns för ca 14 dagar framåt.
const WMO=[[0,"☀️","Klart"],[2,"🌤️","Lätt molnigt"],[3,"☁️","Mulet"],[48,"🌫️","Dimma"],[57,"🌦️","Duggregn"],[67,"🌧️","Regn"],[77,"🌨️","Snö"],[82,"🌧️","Skurar"],[86,"🌨️","Snöbyar"],[99,"⛈️","Åska"]];
const wmo=c=>WMO.find(([max])=>c<=max)||WMO[2];
const wCache={};
function weather(ev){
 const k=ev.lat.toFixed(2)+","+ev.lon.toFixed(2);
 wCache[k]??=fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ev.lat}&longitude=${ev.lon}&daily=weathercode,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FStockholm&forecast_days=16`).then(r=>r.ok?r.json():null).catch(()=>null);
 return wCache[k].then(d=>{const i=d?.daily?d.daily.time.indexOf(ev.datum):-1;if(i<0)return normal(ev);
  const [,ic,txt]=wmo(d.daily.weathercode[i]);return `${ic} ${Math.round(d.daily.temperature_2m_max[i])}°C, ${txt.toLowerCase()}`+(d.daily.precipitation_probability_max[i]>=40?` (${d.daily.precipitation_probability_max[i]}% regn)`:"")});
}
// Längre fram än prognosen: hur vädret brukar vara. Tittar på samma vecka förra året.
function normal(ev){
 const d=new Date(ev.datum+"T12:00");d.setFullYear(d.getFullYear()-1);
 if(d>new Date(Date.now()-5*864e5))return Promise.resolve(null);
 const a=new Date(d-3*864e5),b=new Date(+d+3*864e5),k="n"+ev.lat.toFixed(1)+","+ev.lon.toFixed(1)+iso(a);
 wCache[k]??=fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${ev.lat.toFixed(1)}&longitude=${ev.lon.toFixed(1)}&start_date=${iso(a)}&end_date=${iso(b)}&daily=temperature_2m_max,precipitation_sum&timezone=Europe%2FStockholm`).then(r=>r.ok?r.json():null).catch(()=>null);
 return wCache[k].then(x=>{const t=x?.daily?.temperature_2m_max?.filter(Number.isFinite);if(!t?.length)return null;
  const regn=x.daily.precipitation_sum.filter(p=>p>=1).length,snitt=Math.round(t.reduce((s,v)=>s+v,0)/t.length);
  return `${regn>=4?"🌦️":"🌡️"} Brukar vara ca ${snitt}°C${regn>=4?", ofta regn":""}`});
}
function fillWeather(root){root.querySelectorAll("[data-w]").forEach(el=>{const ev=EVENTS.find(e=>e.id===el.dataset.w);
 weather(ev).then(w=>{if(w){el.textContent=w;el.hidden=false}})})}

// Bild: eventets egen bild om den finns, annars en färgbakgrund som hör till eventets kategori
const PALETT=[["#ff7a59","#ff3d71"],["#7b61ff","#3b5bdb"],["#00b4d8","#0077b6"],["#2bb673","#0b8a5f"],["#ffb347","#ff7a00"],["#ff6fb5","#b5179e"],["#5ad1c8","#2a9d8f"]];
function art(ev){const k=(ev.tags[0]||ev.t);let h=0;for(const ch of k)h=(h*31+ch.charCodeAt(0))>>>0;
 const [a,b]=PALETT[h%PALETT.length];return `background:linear-gradient(135deg,${a},${b})`}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return"webben"}};
const pic=(ev,cls)=>`<div class="${cls}" style="${art(ev)}">${ev.e}${ev.img?`<img src="${esc(ev.img)}" alt="" loading="lazy" draggable="false" onerror="this.remove()">`:""}</div>`;

const facts=ev=>`<div class="facts">${price(ev.pris)}<span class="chip">🕒 ${esc(when(ev))}</span><span class="chip">📍 ${esc(ev.plats)}</span><span class="chip">${kmTxt(ev)}</span><span class="chip" data-w="${esc(ev.id)}" hidden></span></div>`;

function note(msg){const n=$("#note");n.textContent=msg;n.classList.add("show");clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove("show"),1600)}
function show(v){
 document.querySelectorAll(".view").forEach(x=>x.hidden=true);
 $("#v-"+v).hidden=false;
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 document.querySelector("header").hidden=v!=="start";
 if(v!=="detail")prev=v;
 if(v==="int")renderSaved();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.v));

// Event med känt pris först, sedan närmast och tidigast
function sortNear(list){return [...list].sort((a,b)=>(a.pris==null)-(b.pris==null)||Math.round(km(me,a)/5)-Math.round(km(me,b)/5)||(a.datum+a.tid).localeCompare(b.datum+b.tid))}

// Start: swipe-kort
function renderDeck(){
 $(".actions").style.visibility="";
 const d=$("#deck");d.innerHTML="";
 if(!EVENTS.length){d.innerHTML='<div class="empty">Inga event att visa just nu.<br>Nya event hämtas varje måndag.</div>';return}
 if(!queue.length){d.innerHTML='<div class="empty">Inga fler event här.<br><br><button class="back" id="again">Visa alla event</button></div>';$("#again").onclick=()=>$("#mode-clear").onclick();return}
 queue.slice(0,2).reverse().forEach((ev,i,arr)=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="stamp yes">GÅ DIT</div><div class="stamp no">NÄSTA</div>${pic(ev,"img")}<div class="info"><div class="facts"><span class="chip" data-w="${esc(ev.id)}" hidden></span>${price(ev.pris)}<span class="chip">${kmTxt(ev)}</span></div><h2>${esc(ev.t)}</h2><div class="sub">${esc(when(ev))}, ${esc(ev.plats)}</div></div>`;
  if(i===arr.length-1)drag(c,ev);
  d.appendChild(c);
 });
 fillWeather(d);
}
function decide(ev,yes,card){
 queue=queue.filter(e=>e!==ev);
 if(yes&&!saved.includes(ev)){saved.push(ev);note("Sparad ♥")}
 updateCount();
 if(card){card.style.transition="transform .3s, opacity .3s";card.style.transform=`translateX(${yes?500:-500}px) rotate(${yes?20:-20}deg)`;card.style.opacity=0;setTimeout(renderDeck,250)}else renderDeck();
}
function drag(c,ev){
 let x0=null,dx=0,moved=false;
 c.ondragstart=e=>e.preventDefault();
 c.onpointerdown=e=>{e.preventDefault();x0=e.clientX;moved=false;c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>5)moved=true;c.style.transform=`translateX(${dx}px) rotate(${dx/15}deg)`;c.querySelector(".yes").style.opacity=Math.max(0,dx/100);c.querySelector(".no").style.opacity=Math.max(0,-dx/100)};
 c.onpointerup=()=>{if(x0===null)return;x0=null;if(dx>100)decide(ev,true,c);else if(dx<-100)decide(ev,false,c);else{c.style.transition="transform .2s";c.style.transform="";c.querySelectorAll(".stamp").forEach(s=>s.style.opacity=0);setTimeout(()=>c.style.transition="",200);if(!moved)flipCard(c,ev)}dx=0};
}
$("#btn-yes").onclick=()=>queue[0]&&decide(queue[0],true,$("#deck .card:last-child"));
$("#btn-no").onclick=()=>queue[0]&&decide(queue[0],false,$("#deck .card:last-child"));
document.addEventListener("keydown",e=>{if($("#v-start").hidden)return;if(e.key==="ArrowRight")$("#btn-yes").click();if(e.key==="ArrowLeft")$("#btn-no").click()});

// Vänd kortet: info på baksidan i stället för en ny sida
function shareEvent(ev){
 const data={title:ev.t,text:`Ska vi gå på ${ev.t}? ${when(ev)}, ${ev.plats}`,url:ev.url||location.href};
 if(navigator.share)navigator.share(data).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(`${data.text} ${data.url}`).then(()=>note("Länk kopierad, skicka den till en kompis"),()=>note("Kunde inte kopiera"));
}
function flipCard(c,ev){
 c.style.transition="transform .18s";c.style.transform="rotateY(90deg)";$(".actions").style.visibility="hidden";
 setTimeout(()=>{
  c.onpointerdown=c.onpointermove=c.onpointerup=null;c.classList.add("flipped");
  c.innerHTML=`${pic(ev,"bimg").replace(/<\/div>$/,'<button class="flipb" data-a="flip">↻ Vänd tillbaka</button></div>')}<div class="bi"><h2>${esc(ev.t)}</h2>${facts(ev)}
   <button class="cta" data-a="share">Skicka till kompis</button>
   <button class="cta ghost" data-a="save">${saved.includes(ev)?"Sparad ♥":"Spara ♥"}</button>
   ${ev.url?`<a class="cta ghost" href="${esc(ev.url)}" target="_blank" rel="noopener">Eventets sida på ${esc(host(ev.url))} ↗</a>`:""}</div>`;
  c.querySelector('[data-a=share]').onclick=()=>shareEvent(ev);
  c.querySelector('[data-a=save]').onclick=e=>{if(!saved.includes(ev)){saved.push(ev);updateCount();note("Sparad ♥")}e.target.textContent="Sparad ♥"};
  c.querySelector('.bimg').onclick=()=>renderDeck();
  fillWeather(c);
  c.style.transition="none";c.style.transform="rotateY(-90deg)";
  requestAnimationFrame(()=>requestAnimationFrame(()=>{c.style.transition="transform .18s";c.style.transform="rotateY(0)"}));
 },180);
}

// Lista (Sök + Sparade)
const row=ev=>`<div class="row" data-id="${esc(ev.id)}">${pic(ev,"e")}<div><b>${esc(ev.t)}</b><div class="mini"><span>${esc(when(ev))}</span><span>${priceTxt(ev.pris)}</span><span>${kmTxt(ev)}</span></div></div></div>`;
function bindRows(el){el.querySelectorAll(".row").forEach(r=>r.onclick=()=>openDetail(EVENTS.find(e=>e.id===r.dataset.id)))}
// Sök: filter på pris, sortering och "bäst träff"
let maxPris="",sortBy="match",chosen=new Set();
function score(e,words){let p=0;const t=e.t.toLowerCase(),pl=e.plats.toLowerCase();
 for(const w of words){if(t.includes(w))p+=3;if(e.tags.some(x=>x===w))p+=3;else if(e.tags.some(x=>x.includes(w)))p+=2;if(pl.includes(w))p+=1}
 return p}
// Bäst träff är alltid grunden. Närmast, Snarast och Billigast är val man kan lägga ovanpå.
function hitsNow(){
 const q=[$("#q").value.trim().toLowerCase(),...chosen].filter(Boolean).join(" "),words=q.split(/\s+/).filter(Boolean);
 let list=EVENTS.map(e=>({e,p:words.length?score(e,words):1})).filter(x=>x.p>0);
 if(maxPris!=="")list=list.filter(x=>x.e.pris!=null&&x.e.pris<=+maxPris);
 const near=(a,b)=>km(me,a.e)-km(me,b.e),soon=(a,b)=>(a.e.datum+(a.e.tid||"")).localeCompare(b.e.datum+(b.e.tid||"")),cheap=(a,b)=>(a.e.pris??1e9)-(b.e.pris??1e9);
 list.sort(sortBy==="soon"?(a,b)=>soon(a,b)||near(a,b):sortBy==="near"?(a,b)=>near(a,b)||soon(a,b):sortBy==="price"?(a,b)=>cheap(a,b)||near(a,b):(a,b)=>b.p-a.p||near(a,b));
 return {q,hits:list.map(x=>x.e)};
}
const prisTxt=()=>maxPris===""?"":maxPris==="0"?"gratis":`max ${maxPris} kr`;
function search(){
 const {q,hits}=hitsNow(),r=$("#results"),b=$("#swipe-hits"),l=$("#list-hits");
 const n=`${hits.length} ${hits.length===1?"event matchar":"events matchar"}`;
 $("#count-hits").textContent=n;$("#list-sum").textContent=[n,q&&`"${q}"`,prisTxt()].filter(Boolean).join(", ");
 b.disabled=l.disabled=!hits.length;
 const unknown=maxPris!==""?EVENTS.filter(e=>e.pris==null).length:0;
 r.innerHTML=(hits.length?hits.slice(0,60).map(row).join(""):EVENTS.length?'<p class="hint">Inga träffar. Här är närmaste event:</p>'+row(sortNear(EVENTS)[0]):'<p class="hint">Inga event att söka bland just nu.</p>')
  +(unknown?`<p class="hint">${unknown} event saknar pris från arrangören och visas inte med prisfilter.</p>`:"");
 bindRows(r);
}
document.querySelectorAll("#f-sort .seg").forEach(b=>b.onclick=()=>{sortBy=sortBy===b.dataset.s?"match":b.dataset.s;document.querySelectorAll("#f-sort .seg").forEach(x=>x.classList.toggle("on",x.dataset.s===sortBy));search()});
$("#pris").oninput=()=>{const v=+$("#pris").value;maxPris=v>=500?"":String(v);$("#pris-txt").textContent=v>=500?"Alla priser":v===0?"Gratis":`${v} kr`;search()};
function sokPage(list){$("#sok-pick").hidden=list;$("#sok-list").hidden=!list;$("#v-sok").scrollTop=0}
$("#swipe-hits").onclick=()=>{const {q,hits}=hitsNow();
 queue=hits.filter(e=>!saved.includes(e));
 const sort={near:"närmast först",soon:"snarast först",price:"billigast först"}[sortBy];
 $("#mode-txt").textContent=[q&&`"${q}"`,prisTxt(),sort].filter(Boolean).join(", ")||"Dina val";
 $("#mode").hidden=false;renderDeck();show("start")};
$("#mode-clear").onclick=()=>{$("#mode").hidden=true;queue=sortNear(EVENTS.filter(e=>!saved.includes(e)));renderDeck()};
$("#list-hits").onclick=()=>{search();sokPage(true)};
$("#list-back").onclick=()=>sokPage(false);
$("#q").oninput=search;
function renderTags(){
 const count={};EVENTS.forEach(e=>e.tags.forEach(t=>count[t]=(count[t]||0)+1));
 const top=Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t])=>t);
 $("#tags").innerHTML=top.map(t=>`<button>${esc(t)}</button>`).join("");
 $("#tags").querySelectorAll("button").forEach(b=>b.onclick=()=>{const t=b.textContent;chosen.has(t)?chosen.delete(t):chosen.add(t);b.classList.toggle("on",chosen.has(t));b.setAttribute("aria-pressed",chosen.has(t));search()});
}
const sq=ev=>`<div class="sq" data-id="${esc(ev.id)}" role="button" tabindex="0">${pic(ev,"sqimg")}<div class="sqt">${esc(ev.t)}<small>${esc(when(ev))}, ${priceTxt(ev.pris)}</small></div></div>`;
function renderSaved(){
 const s=$("#saved");
 if(!saved.length){s.innerHTML='<p class="hint">Inget sparat än. Swipea höger på Start.</p>';return}
 const groups={};saved.forEach(ev=>(groups[ev.tags[0]||"övrigt"]??=[]).push(ev));
 s.innerHTML=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).map(([t,list])=>`<section class="shelf"><h3>${esc(t)}</h3><div class="rail">${list.map(sq).join("")}</div></section>`).join("");
 s.querySelectorAll(".sq").forEach(c=>{const open=()=>openDetail(EVENTS.find(e=>e.id===c.dataset.id));c.onclick=open;c.onkeydown=e=>{if(e.key==="Enter")open()}});
}
function updateCount(){const c=$("#count");c.textContent=saved.length;c.hidden=!saved.length}

// Eventdetalj
function openDetail(ev){
 const d=$("#v-detail");
 d.innerHTML=`<button class="back" id="back">‹ Tillbaka</button>${pic(ev,"pic")}<h2>${esc(ev.t)}</h2>
 <dl><dt>När</dt><dd>${esc(when(ev))}</dd><dt>Plats</dt><dd>${esc(ev.plats)}</dd><dt>Avstånd</dt><dd>${kmTxt(ev)} från ${esc(me.namn)}</dd><dt>Pris</dt><dd>${ev.pris==null?(ev.url?`<a href="${esc(ev.url)}" target="_blank" rel="noopener">Står på eventets sida ↗</a>`:"Okänt"):priceTxt(ev.pris)}</dd><dt>Väder</dt><dd id="dw">Hämtar…</dd></dl>
 ${ev.url?`<a class="cta ghost" href="${esc(ev.url)}" target="_blank" rel="noopener">Till eventets sida på ${esc(host(ev.url))} ↗</a>`:""}
 <button class="cta" id="save">${saved.includes(ev)?"Sparad ♥":"Spara ♥"}</button>`;
 weather(ev).then(w=>{const el=$("#dw");if(el)el.textContent=w||"Ingen väderinfo just nu"});
 $("#back").onclick=()=>show(prev);
 $("#save").onclick=()=>{if(!saved.includes(ev)){saved.push(ev);queue=queue.filter(e=>e!==ev);updateCount();renderDeck();note("Sparad ♥")}$("#save").textContent="Sparad ♥"};
 show("detail");
}

// Plats
function refresh(){queue=($("#mode").hidden?sortNear(EVENTS):hitsNow().hits).filter(e=>!saved.includes(e));renderDeck();search();$("#where").textContent="Nära "+me.namn}
function locate(){
 if(!navigator.geolocation){note("Din webbläsare kan inte dela plats");return}
 $("#where").textContent="Hämtar plats…";
 navigator.geolocation.getCurrentPosition(p=>{me={lat:p.coords.latitude,lon:p.coords.longitude,namn:"dig"};refresh();note("Visar event nära dig")},
  ()=>{$("#where").textContent="Nära "+me.namn;note("Platsen nekades, visar nära Bro")},{timeout:10000,maximumAge:600000});
}
$("#where").onclick=locate;

// Start
(async()=>{
 let data;
 try{const r=await fetch("events.json",{cache:"no-cache"});data=r.ok?await r.json():{events:[]}}catch{data={events:[]}}
 const today=new Date();today.setHours(0,0,0,0);
 EVENTS=(data.exempel?[]:data.events).map(e=>({img:null,url:null,tags:[],e:"✨",...e}))
  .filter(e=>e.datum&&e.datum>=iso(today)&&Number.isFinite(e.lat));
 meta=data;
 $("#source").textContent=EVENTS.length?`Källor: ${data.kalla}`:"";
 renderTags();refresh();
 locate();
})();
</script>
</body>
</html>
